<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <style>
    body{
        background-color: blue;
    }
    .container{
    display:flex;
    justify-content: center;
    align-items: stretch;
    gap: 20px;
    flex-wrap: wrap;
    background-color: rgb(245, 245, 104);
    padding: 20px;
    }
    .container div{
        flex: 1 1 100px;
        padding: 30px;
        color:white;
        border-radius: 99px;
        background-color: black;
    }

    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>
</body>
</html>
