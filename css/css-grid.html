<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid box</title>
    <style>
        * {
      box-sizing: border-box;
    }

     body {
      border: 5px solid red;
      background-color: gray;
    } 
    .grid{
        display: grid;
        grid-template-columns:1fr 2fr 1fr ;
        row-gap: 10px;
        column-gap: 20px;
        padding: 40px;
    }
    .grid div{
        padding: 20px;
        text-align: center;
        font-size: 30px;
        border:3px solid gold;

    }
    .header{
        background: brown;
        /* border: 4px double blue; */
         grid-area: 1 / 1 / span 1 / span 3;
    } 
    .menu1{
        background: brown;
        border: 4px double blue;
         grid-area: 2 / 1 / span 1 / span 1;
    } 
    .menu2{
        background: brown;
        border: 4px double blue;
         grid-area: 2 / 3 / span 1 / span 1;
    } 
    .main{
        background: brown;
        border: 4px double blue;
         grid-area: 2 / 2 / span 2 / span 1;
    } 
    .menu3{
        background: brown;
        border: 4px double blue;
         grid-area: 3 / 1 / span 1 / span 1;
    } 
    .menu4{
        background: brown;
        border: 4px double blue;
         grid-area: 3 / 3 / span 1 / span 1;
    } 
    
    .footer{
        background: brown;
        border: 4px double blue;
         grid-area: 4 / 1 / span 1 / span 3;
    } 
    </style>
</head>
<body>
    <div class="grid">
        <div class="header">1</div>
        <div class="menu1">2</div>
        <div class="menu2">3</div>
        <div class="main">4</div>
        <div class="menu3">5</div>
        <div class="menu4">6</div>
        <div class="footer">7</div>
    </div>
</body>
</html>
