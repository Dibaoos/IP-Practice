<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Example</title>
</head>
<body>

    <h1>Student Information Table</h1>

    <table border="1" cellpadding="10" cellspacing="0">

        <caption>Student Information</caption>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>CGPA</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>101</td>
                <td>Rahim</td>
                <td>CSE</td>
                <td>3.80</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Karim</td>
                <td>EEE</td>
                <td>3.75</td>
            </tr>

            <tr>
                <td>103</td>
                <td colspan="2">Business Administration</td>
                <td>3.90</td>
            </tr>

            <tr>
                <td rowspan="2">104</td>
                <td>Nusrat</td>
                <td>CSE</td>
                <td>3.95</td>
            </tr>

            <tr>
                <td>Jannat</td>
                <td>ECE</td>
                <td>3.88</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="4" align="center">
                    Total Students: 5
                </td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
