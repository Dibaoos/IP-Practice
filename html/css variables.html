<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css variables</title>
<style> 
:root{
    --primary:#123674;
    --secondary:#741250;
    --thirdly:#12742e; 
    --forth:#12002e;
    --fifth:#996702;
}
.button1{
    background: var(--primary);
    color: white;
}
.button2{
    background: var(--secondary);
    color: white;
}
.button3{
    background: var(--thirdly);
    color: white;
}
.button4{
    background: var(--forth);
    color: white;
}
.button5{
    background: var(--fifth);
    color: white;
}


</style>
</head>
<body>
    <button class="button1">submit</button>
    <button class="button2">click me</button>
    <button class="button3">postpond</button>
    <button class="button4">clear</button>
    <button class="button5">cancel</button>
</body>
</html>
