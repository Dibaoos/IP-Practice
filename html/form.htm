<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Form Example</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    <form action="#" method="post">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" required>
            <br><br>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname">
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
            <br><br>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone">
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
            <br><br>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>

        </fieldset>

        <br>

        <fieldset>
            <legend>Course Information</legend>

            <label for="department">Department:</label>
            <select id="department" name="department">

                <optgroup label="Engineering">
                    <option>CSE</option>
                    <option>EEE</option>
                    <option>CE</option>
                </optgroup>

                <optgroup label="Business">
                    <option>BBA</option>
                    <option>Accounting</option>
                </optgroup>

            </select>

            <br><br>

            <label for="skills">Skills:</label>
            <input list="skilllist" id="skills" name="skills">

            <datalist id="skilllist">
                <option value="HTML">
                <option value="CSS">
                <option value="JavaScript">
                <option value="Python">
                <option value="C++">
            </datalist>

        </fieldset>

        <br>

        <fieldset>
            <legend>Other Information</legend>

            <label>Hobbies:</label>

            <input type="checkbox" id="reading" name="hobby" value="Reading">
            <label for="reading">Reading</label>

            <input type="checkbox" id="sports" name="hobby" value="Sports">
            <label for="sports">Sports</label>

            <input type="checkbox" id="music" name="hobby" value="Music">
            <label for="music">Music</label>

            <br><br>

            <label for="color">Favorite Color:</label>
            <input type="color" id="color" name="color">
            <br><br>

            <label for="photo">Upload Photo:</label>
            <input type="file" id="photo" name="photo">
            <br><br>

            <label for="website">Website:</label>
            <input type="url" id="website" name="website">
            <br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="1" max="100">
            <br><br>

            <label for="range">Experience:</label>
            <input type="range" id="range" name="range" min="0" max="10">
            <br><br>

            <label for="search">Search:</label>
            <input type="search" id="search" name="search">
            <br><br>

            <label for="time">Time:</label>
            <input type="time" id="time" name="time">
            <br><br>

            <label for="month">Month:</label>
            <input type="month" id="month" name="month">
            <br><br>

            <label for="week">Week:</label>
            <input type="week" id="week" name="week">
            <br><br>

            <label for="comments">Comments:</label><br>
            <textarea id="comments" name="comments" rows="5" cols="40"></textarea>

        </fieldset>

        <br>

        <label for="result">Output:</label>
        <output id="result">Ready</output>

        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        <button type="button">Click Me</button>

    </form>

</body>
</html>
